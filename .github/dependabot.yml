version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # La versión de Playwright debe coincidir con la etiqueta de la imagen del Dockerfile:
      # se actualizan a la vez y a mano.
      - dependency-name: playwright
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: mcr.microsoft.com/playwright
