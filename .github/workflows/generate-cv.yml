name: Regenerate CVs

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CV generation on the server
        env:
          CV_ADMIN_TOKEN: ${{ secrets.CV_ADMIN_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "https://aitorivera.com/api/generate-upload-cv" \
            -H "Authorization: Bearer ${CV_ADMIN_TOKEN}"
